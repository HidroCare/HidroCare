[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # A URL e a chave anon do Supabase sao publicas por natureza (vao no bundle).
  # Sem esta linha o Netlify acusa "secrets scanning" e derruba o build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Rotas do Vue Router: qualquer endereco devolve o index.html (F5 nao da 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
